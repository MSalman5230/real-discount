# Standalone deployment: save this file as compose.yaml in your hosting folder.
# Set the required variables in your shell or Docker hosting platform.
# First login: docker compose run --rm real-discount watch --once
# Start after login: docker compose up -d

services:
  real-discount:
    image: ghcr.io/msalman5230/real-discount:latest
    init: true
    restart: unless-stopped
    command: ["watch"]
    environment:
      # Required: Compose reports a clear error if a value is missing or empty.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:?Set TELEGRAM_PHONE}
      # The reader is restricted to this approved group and polling policy.
      TELEGRAM_SOURCE_CHATS: ${TELEGRAM_SOURCE_CHATS:-https://t.me/+RMtFLhPbWG9Hn0MQ}
      TELEGRAM_USER_SESSION: ${TELEGRAM_USER_SESSION:-telegram-user}
      TELEGRAM_DETECTION_MODE: ${TELEGRAM_DETECTION_MODE:-poll}
      TELEGRAM_ALLOW_ACCOUNT_UPDATES: ${TELEGRAM_ALLOW_ACCOUNT_UPDATES:-false}
      # Optional settings use these defaults when unset or empty.
      HISTORY_MONTHS: ${HISTORY_MONTHS:-6}
      DISCOUNT_THRESHOLD_PERCENT: ${DISCOUNT_THRESHOLD_PERCENT:-20}
      TELEGRAM_POLL_SECONDS: ${TELEGRAM_POLL_SECONDS:-3}
    volumes:
      # Change ONLY the host path (left side) to your dedicated state directory.
      # Example: /mnt/user/appdata/real-discount:/data
      # Keep /data writable so the login session and reading checkpoint persist.
      - ./data:/data
    # Leave the container user unset: startup prepares data permissions, then
    # runs the monitor as UID/GID 10001. See README for older image versions.
    # Keep Matplotlib's cache and temporary files in RAM.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    # To view output, stop the service and run it in the foreground:
    # docker compose stop real-discount
    # docker compose run --rm real-discount watch
    logging:
      driver: none
