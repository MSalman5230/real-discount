services:
  real-discount:
    image: ghcr.io/msalman5230/real-discount:latest
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    # Matplotlib's font cache and temporary files stay in RAM.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    # Telegram delivery is the output; do not archive console logs on disk.
    logging:
      driver: none
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
