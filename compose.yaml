services:
  real-discount:
    image: ghcr.io/msalman5230/real-discount:latest
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    # Matplotlib's font cache and temporary files stay in RAM.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    # Telegram delivery is the output; do not archive console logs on disk.
    logging:
      driver: none
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/data
