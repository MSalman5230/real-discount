services:
  real-discount:
    image: ghcr.io/msalman5230/real-discount:latest
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    env_file:
      - ./.env
    # Matplotlib's font cache and temporary files stay in RAM.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "1"
    volumes:
      - ./data:/data
